name: CI

# The engine is developed on macOS and has never been built on Linux, and only
# once (badly) on Windows. The point of this workflow is to turn "it's broken
# on the other platforms" into a specific, incrementally fixable list of
# compiler errors — so the Linux and Windows lanes are EXPECTED to fail at
# first. See `experimental` in the matrix below.

on:
  push:
    branches: [main]
    # Documentation-only commits do NOT need a 4-platform build of Assimp and
    # bgfx from source. They are validated by docs.yml, which runs the same
    # engine_doctor contract in seconds without configuring CMake.
    # NOTE: a commit touching code AND docs still lands here (path filters are
    # per-commit, not per-file), so the docs ctest lane below still guards
    # staleness whenever code actually moves — which is the case that matters.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ENGINE_STATUS.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Supersede in-flight runs for PULL REQUESTS only: a PR's older run is
# genuinely stale, and iterating on a PR should not queue four builds.
# Pushes to main are NOT cancelled — main is the ratchet, every commit on it
# is a release candidate, and a cancelled run leaves that commit with no
# verdict at all (which is what was happening: pushing a short series of
# commits cancelled every run but the last).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Linux and Windows are known-broken. Marking them non-fatal keeps the
    # workflow useful from day one instead of permanently red — macOS still
    # gates merges, and the other two report progress. Flip `experimental`
    # to false the moment a platform first goes green, so it can't regress.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64, AppleClang)
            slug: macos-appleclang
            os: macos-latest
            experimental: false

          - name: Linux (x64, GCC)
            slug: linux-gcc
            os: ubuntu-latest
            experimental: true

          - name: Linux (x64, Clang)
            slug: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            experimental: true

          # This leg is also the ONLY thing that compiles
          # src/runtime/platform/title_bar_windows.cpp, which was written
          # without a Windows toolchain to check it against. Its first green
          # run is what turns that file from a proposal into code.
          - name: Windows (x64, MSVC)
            slug: windows-msvc
            os: windows-latest
            experimental: true

    steps:
      # MUST precede checkout. Windows runners default to core.autocrlf=true,
      # which rewrites LF to CRLF on clone; the patches in third_party/patches
      # carry LF context lines and then fail to apply ("patch does not apply").
      # Keeping the worktree byte-identical across platforms also avoids a whole
      # class of Windows-only tool surprises.
      - name: Disable git line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # 14 submodules, several with nested submodules of their own
          # (bgfx.cmake -> bgfx). Shallow: history isn't needed to build.
          submodules: recursive
          fetch-depth: 1

      # Local fixes to vendored dependencies live as patch files so they
      # survive a fresh clone. Without this step CI builds unpatched sources
      # and can diverge from every developer machine — which is exactly the
      # class of bug this workflow exists to catch.
      - name: Apply third-party patches
        if: hashFiles('third_party/patches/*.patch') != ''
        shell: bash
        run: ./scripts/apply_third_party_patches.sh

      # GLFW needs X11 + Wayland + xkbcommon; miniaudio needs ALSA; bgfx needs
      # GL headers. `xorg-dev` is the umbrella that covers the X11 extension
      # headers (Xrandr/Xinerama/Xcursor/Xi) GLFW looks for individually.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            xorg-dev libx11-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libsqlite3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts cl.exe and the Windows SDK on PATH so the Ninja generator works
      # the same way it does on the other two platforms. Without this, CMake
      # falls back to the Visual Studio generator and the build diverges from
      # what developers run locally.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Assimp and bgfx dominate build time and rarely change. The cache is
      # keyed per matrix leg so compilers never share entries.
      # Cache keys may not contain commas, and the display names do
      # ("macOS (arm64, AppleClang)") — hence the separate slug. This failed
      # every leg before Configure, so nothing had ever compiled.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.slug }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 1G

      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # modules/net is a Rust staticlib. The runners ship a Rust toolchain, so
      # this only pins/reports it — but do it explicitly rather than relying on
      # the image, because modules/net SKIPS ITSELF when cargo is missing and
      # the build would still go green having quietly tested nothing.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # NO `shell: bash` here, and that is the fix rather than a style choice.
      # Git-for-Windows' bash puts C:\Program Files\Git\usr\bin ahead of the
      # MSVC toolchain, and that directory contains a `link.exe` — coreutils'
      # hardlink tool, not the linker. rustc found it first and every Windows
      # run died with "linking with `link.exe` failed: exit code: 1" BEFORE
      # reaching Configure, which is why the C++ has never compiled on Windows
      # and title_bar_windows.cpp is still unvalidated.
      # Letting each runner use its default shell (bash on Unix, pwsh on
      # Windows) keeps MSVC's link.exe first. The command is identical in both.
      - name: Rust unit tests (engine_net)
        run: cargo test --manifest-path modules/net/Cargo.toml

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      # Tee'd so a failing leg can publish the actual errors to the job SUMMARY.
      # The whole point of the experimental legs is to turn "broken on Windows"
      # into a specific, incrementally fixable list — and that list is useless
      # if reading it means downloading an artifact and scrolling a 40 MB log.
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build-output.log

      - name: Summarise compiler errors
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          # MSVC writes "error C2065:", GCC/Clang write "error:". De-duplicated
          # so 200 instantiations of one mistake read as one line — that is what
          # makes the list actionable instead of a wall to scroll.
          errors=$(grep -aE 'error[ ]?(C[0-9]+)?:' build-output.log \
                   | sed -E 's/^[[:space:]]+//' | sort -u || true)
          count=$(printf '%s' "$errors" | grep -c . || true)
          {
            echo "### ${{ matrix.name }} — compiler errors"
            echo
            if [ -z "$errors" ]; then
              echo "No compile errors matched. The failure was in CONFIGURE or"
              echo "LINK — see the Build step log; the summary cannot help here."
            else
              echo "$count distinct error line(s); first 40:"
              echo
              echo '```'
              printf '%s\n' "$errors" | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Documentation/maturity contract (docs/process/engineering-standards.md): doc
      # front-matter must match the tree, tier claims must have evidence, and
      # ENGINE_STATUS.md must be regenerated. Platform-independent, so it runs
      # only on the gating leg — the other legs would just repeat it.
      - name: Test (docs contract)
        if: matrix.name == 'macOS (arm64, AppleClang)'
        shell: bash
        run: ctest --test-dir build -L docs --output-on-failure

      # The exploration lane is NOT run here: it uses fresh seeds, so it could
      # fail on a commit that did not cause the bug, which would make CI a coin
      # flip. It belongs on a schedule (nightly / self-hosted soak), where a
      # find gets triaged and its seed committed to the corpus — after which
      # the regression lane above catches it forever.

      # The build tree is large and mostly uninteresting; the logs are what
      # you need to triage a failing platform, and `compile_commands.json`
      # lets you reproduce a single failing translation unit locally.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: |
            build-output.log
            build/CMakeCache.txt
            build/compile_commands.json
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  # The shipping posture is a build-level invariant ("the runtime never parses
  # FBX" — Assimp is neither compiled nor linked). It's cheap to verify and
  # easy to break by adding an include, so it gets its own lane.
  shipping-runtime:
    name: Shipping runtime (no source importers)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply third-party patches
        if: hashFiles('third_party/patches/*.patch') != ''
        shell: bash
        run: ./scripts/apply_third_party_patches.sh

      - run: brew install ninja

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shipping-macos
          max-size: 1G

      - name: Configure (importers OFF)
        run: |
          cmake -B build-ship -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_WITH_SOURCE_IMPORTERS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build engine_player
        run: cmake --build build-ship --target engine_player --parallel

      # Assimp links statically, so its symbols would be DEFINED in the binary
      # rather than undefined — check the whole symbol table, not just `nm -u`.
      - name: Assert Assimp is not linked in
        shell: bash
        run: |
          bin=build-ship/engine_player
          test -f "$bin" || { echo "::error::$bin was not produced"; exit 1; }
          if nm "$bin" 2>/dev/null | grep -qi assimp; then
            echo "::error::engine_player contains Assimp symbols — the cooked-runtime invariant (runtime never parses source formats) is broken."
            nm "$bin" | grep -i assimp | head -20
            exit 1
          fi
          echo "OK: no Assimp symbols in engine_player"
