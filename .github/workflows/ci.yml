name: CI

# FIVE PLATFORMS, because "runs everywhere" is a claim and this is the evidence:
#
#   macOS   arm64            gating
#   Linux   x86_64, arm64    GCC and Clang on x64, GCC on arm64
#   Windows x86_64, arm64    MSVC
#
# Both ARCHITECTURES of Linux and Windows are here on purpose, not for symmetry.
# The bugs this catches are the ones a single arch cannot: the decimator's
# `(int32_t)floor(NaN)` is INT_MIN on x86-64 and 0 on arm64, which made two
# machines cook different LOD levels from one mesh — a difference no amount of
# testing on one arch would ever have shown. Anything that reaches the DDC has
# to agree across ISAs or the shared cache is a liability.
#
# `experimental` marks a leg as non-fatal. It is a LADDER, not a resting place:
# flip it to false the moment a platform first goes green, so it cannot regress
# back to broken while still looking amber.

on:
  push:
    branches: [main]
    # Documentation-only commits do NOT need a 4-platform build of Assimp and
    # bgfx from source. They are validated by docs.yml, which runs the same
    # engine_doctor contract in seconds without configuring CMake.
    # NOTE: a commit touching code AND docs still lands here (path filters are
    # per-commit, not per-file), so the docs ctest lane below still guards
    # staleness whenever code actually moves — which is the case that matters.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ENGINE_STATUS.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Nightly, so the legs that no longer run on every push still run EVERY DAY
  # against whatever landed. 02:00 UTC — after the working day, before the next.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Supersede in-flight runs for PULL REQUESTS only: a PR's older run is
# genuinely stale, and iterating on a PR should not queue four builds.
# Pushes to main are NOT cancelled — main is the ratchet, every commit on it
# is a release candidate, and a cancelled run leaves that commit with no
# verdict at all (which is what was happening: pushing a short series of
# commits cancelled every run but the last).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Why these six legs, preserved from the matrix they annotated ──────────
  # arm64 Linux. Not redundant with macOS-arm64: same ISA, completely
  # different libc and C++ standard library (glibc + libstdc++ against
  # Apple's libc + libc++). The missing <cstring> includes that broke the
  # x64 Linux legs were invisible on macOS for exactly that reason —
  # libc++ pulls it in transitively and libstdc++ does not.
  # This leg is also the ONLY thing that compiles
  # src/runtime/platform/title_bar_windows.cpp, which was written
  # without a Windows toolchain to check it against. Its first green
  # run is what turns that file from a proposal into code.
  # arm64 Windows — the platform combination with the least prior art in
  # this tree and the most ways to be wrong: MSVC targeting aarch64, a
  # Rust host triple that is not the default, and bgfx's D3D tooling on
  # an arch its CI does not cover.

  # ── Which legs run, and when ────────────────────────────────────────────────
  # Wall clock is set entirely by the slowest leg: macOS finishes in ~4m50s and
  # Windows x64 in ~11m20s, so every push paid Windows' price for a verdict
  # macOS had already given. Testing is 20 SECONDS of that; the rest is getting
  # to the point where you can test.
  #
  # So the gating leg runs on every push and the other four run NIGHTLY, plus on
  # demand. The trade is stated rather than hidden: a portability regression can
  # now sit on main for up to a day. Three things make that acceptable —
  #
  #   * all five legs are `experimental: false`, so the nightly is a HARD
  #     failure, not an amber note. A ratchet that reports late still ratchets.
  #   * workflow_dispatch runs the full matrix on demand, which is what to do
  #     before anything that matters.
  #   * the classes of bug these legs actually catch — a missing <cstring>, an
  #     x86-64-only prebuilt, alignof(max_align_t) differing — are introduced by
  #     code, and code lands on a schedule of hours, not seconds.
  #
  # The matrix lives here as JSON because GitHub does not expose `matrix` to a
  # job-level `if`, so per-leg selection has to happen before the matrix exists.
  # It is defined ONCE and filtered, rather than duplicated per event.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          # on_push marks the gating leg. Everything else waits for the nightly.
          cat > all.json <<'JSON'
          [
            {"name":"macOS (arm64, AppleClang)","slug":"macos-appleclang","os":"macos-latest","experimental":false,"on_push":true},
            {"name":"Linux (x64, GCC)","slug":"linux-x64-gcc","os":"ubuntu-latest","experimental":false},
            {"name":"Linux (x64, Clang)","slug":"linux-x64-clang","os":"ubuntu-latest","cc":"clang","cxx":"clang++","experimental":false},
            {"name":"Linux (arm64, GCC)","slug":"linux-arm64-gcc","os":"ubuntu-24.04-arm","experimental":false},
            {"name":"Windows (x64, MSVC)","slug":"windows-x64-msvc","os":"windows-latest","msvc_arch":"x64","experimental":false},
            {"name":"Windows (arm64, MSVC)","slug":"windows-arm64-msvc","os":"windows-11-arm","msvc_arch":"arm64","rust_target":"aarch64-pc-windows-msvc","experimental":false}
          ]
          JSON
          if [ "${{ github.event_name }}" = "push" ]; then
            sel=$(jq -c '[.[] | select(.on_push == true)]' all.json)
          else
            sel=$(jq -c '.' all.json)
          fi
          # Fail loudly rather than silently running nothing — an empty matrix
          # is a job that reports success having built no platform at all.
          n=$(printf '%s' "$sel" | jq 'length')
          if [ "$n" -eq 0 ]; then
            echo "::error::the leg filter selected NO platforms" >&2; exit 1
          fi
          echo "selected $n leg(s) for event '${{ github.event_name }}':"
          printf '%s' "$sel" | jq -r '.[].name | "  " + .'
          echo "matrix={\"include\":$sel}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Linux and Windows are known-broken. Marking them non-fatal keeps the
    # workflow useful from day one instead of permanently red — macOS still
    # gates merges, and the other two report progress. Flip `experimental`
    # to false the moment a platform first goes green, so it can't regress.
    continue-on-error: ${{ matrix.experimental }}

    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # MUST precede checkout. Windows runners default to core.autocrlf=true,
      # which rewrites LF to CRLF on clone; the patches in third_party/patches
      # carry LF context lines and then fail to apply ("patch does not apply").
      # Keeping the worktree byte-identical across platforms also avoids a whole
      # class of Windows-only tool surprises.
      - name: Disable git line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # 14 submodules, several with nested submodules of their own
          # (bgfx.cmake -> bgfx). Shallow: history isn't needed to build.
          submodules: recursive
          fetch-depth: 1

      # Local fixes to vendored dependencies live as patch files so they
      # survive a fresh clone. Without this step CI builds unpatched sources
      # and can diverge from every developer machine — which is exactly the
      # class of bug this workflow exists to catch.
      - name: Apply third-party patches
        if: hashFiles('third_party/patches/*.patch') != ''
        shell: bash
        run: ./scripts/apply_third_party_patches.sh

      # GLFW needs X11 + Wayland + xkbcommon; miniaudio needs ALSA; bgfx needs
      # GL headers. `xorg-dev` is the umbrella that covers the X11 extension
      # headers (Xrandr/Xinerama/Xcursor/Xi) GLFW looks for individually.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            xorg-dev libx11-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libsqlite3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts cl.exe and the Windows SDK on PATH so the Ninja generator works
      # the same way it does on the other two platforms. Without this, CMake
      # falls back to the Visual Studio generator and the build diverges from
      # what developers run locally.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Ninja is preinstalled on the x64 Windows image but not guaranteed on
      # windows-11-arm, and the generator has to match what developers run
      # locally or the build diverges in ways this workflow exists to catch.
      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "ninja already present:"; ninja --version; exit 0
          }
          choco install ninja -y --no-progress

      # Assimp and bgfx dominate build time and rarely change. The cache is
      # keyed per matrix leg so compilers never share entries.
      # Cache keys may not contain commas, and the display names do
      # ("macOS (arm64, AppleClang)") — hence the separate slug. This failed
      # every leg before Configure, so nothing had ever compiled.
      # NON-FATAL. windows-11-arm has no prebuilt sccache in every action release,
      # and a missing CACHE must never fail a leg whose job is to report whether
      # the CODE compiles. The Configure step below detects what actually landed
      # on PATH rather than assuming this succeeded.
      - name: Compiler cache
        id: ccache
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.slug }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 1G

      # Resolve the launcher ONCE, from what exists, and pass it (or nothing) to
      # CMake. Hard-coding -DCMAKE_CXX_COMPILER_LAUNCHER=sccache on a runner
      # without sccache makes every compile fail with a confusing "failed to run
      # launcher" that looks like a code error.
      - name: Resolve compiler launcher
        id: launcher
        shell: bash
        run: |
          tool=""
          for candidate in sccache ccache; do
            if command -v "$candidate" >/dev/null 2>&1; then tool="$candidate"; break; fi
          done
          if [ -n "$tool" ]; then
            echo "flags=-DCMAKE_C_COMPILER_LAUNCHER=$tool -DCMAKE_CXX_COMPILER_LAUNCHER=$tool" >> "$GITHUB_OUTPUT"
            echo "Using compiler launcher: $tool"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "No compiler cache available — building without one."
          fi

      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # modules/net is a Rust staticlib. The runners ship a Rust toolchain, so
      # this only pins/reports it — but do it explicitly rather than relying on
      # the image, because modules/net SKIPS ITSELF when cargo is missing and
      # the build would still go green having quietly tested nothing.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      # NO `shell: bash` here, and that is the fix rather than a style choice.
      # Git-for-Windows' bash puts C:\Program Files\Git\usr\bin ahead of the
      # MSVC toolchain, and that directory contains a `link.exe` — coreutils'
      # hardlink tool, not the linker. rustc found it first and every Windows
      # run died with "linking with `link.exe` failed: exit code: 1" BEFORE
      # reaching Configure, which is why the C++ has never compiled on Windows
      # and title_bar_windows.cpp is still unvalidated.
      # Letting each runner use its default shell (bash on Unix, pwsh on
      # Windows) keeps MSVC's link.exe first. The command is identical in both.
      - name: Rust unit tests (engine_net)
        run: cargo test --manifest-path modules/net/Cargo.toml

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ${{ steps.launcher.outputs.flags }}

      # Tee'd so a failing leg can publish the actual errors to the job SUMMARY.
      # The whole point of the experimental legs is to turn "broken on Windows"
      # into a specific, incrementally fixable list — and that list is useless
      # if reading it means downloading an artifact and scrolling a 40 MB log.
      # `-k 0` — KEEP GOING after a failure, and this is the difference between a
      # workflow and a treadmill. Ninja stops scheduling new work at the first
      # error, so a leg with six unrelated portability bugs reports ONE, and each
      # fix costs a full round-trip to reveal the next. The Windows port spent six
      # rounds that way: one missing macro, then one POSIX function, then one
      # more, each discovered only after the previous was pushed.
      #
      # With -k 0 the whole graph is attempted and the summary step below gets the
      # complete list. The build still exits non-zero, so nothing is hidden — it
      # just stops rationing the diagnosis. Applied to every leg: the same
      # argument holds anywhere a build can fail in more than one place.
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel -- -k 0 2>&1 | tee build-output.log

      - name: Summarise compiler errors
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          # MSVC writes "error C2065:", GCC/Clang write "error:". De-duplicated
          # so 200 instantiations of one mistake read as one line — that is what
          # makes the list actionable instead of a wall to scroll.
          errors=$(grep -aE 'error[ ]?(C[0-9]+)?:' build-output.log \
                   | sed -E 's/^[[:space:]]+//' | sort -u || true)
          count=$(printf '%s' "$errors" | grep -c . || true)
          {
            echo "### ${{ matrix.name }} — compiler errors"
            echo
            if [ -z "$errors" ]; then
              echo "No compile errors matched. The failure was in CONFIGURE or"
              echo "LINK — see the Build step log; the summary cannot help here."
            else
              echo "$count distinct error line(s); first 80:"
              echo
              echo '```'
              printf '%s\n' "$errors" | head -80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── The unit lane ────────────────────────────────────────────────────
      # THIS HAD NEVER RUN. CI built three platforms and executed only the docs
      # contract, so 63 test binaries had only ever been run on a developer's
      # laptop — including the ones written specifically to pin a bug that had
      # already shipped once. A test nothing runs is a comment with a build cost.
      #
      # Run on EVERY leg, not just the gating one: the whole reason a matrix
      # exists is to catch what differs per platform, and a correctness test
      # that only ever runs on macOS cannot do that. The experimental legs are
      # already non-fatal, so this reports there rather than blocking.
      #
      # Kept ahead of the docs contract deliberately — when both are broken, the
      # code failure is the one worth reading first.
      # NO `shell: bash`, for the same reason the Rust step above avoids it and
      # this is the second time that reason has cost a CI round. Git-for-Windows'
      # bash puts C:\Program Files\Git\usr\bin ahead of the MSVC toolchain, and
      # that directory holds a `link.exe` — coreutils' hardlink tool, not the
      # linker. Two of these ctest entries shell out to `cargo test`
      # (cooked_format_conformance, audio_abi_conformance), so rustc found the
      # wrong link.exe and both died with "linking with `link.exe` failed: exit
      # code: 1" — while the C++ tests, already linked by ninja, ran fine.
      #
      # Letting each runner use its default shell (bash on Unix, pwsh on Windows)
      # keeps MSVC's linker first. The command is identical in both.
      - name: Test (unit lane)
        run: ctest --test-dir build -L unit --output-on-failure --timeout 600

      # The seeded regression corpus: every input that has ever broken a parser,
      # replayed deterministically. 65 seeds across 5 domains, and it is the
      # oldest piece of institutional memory in the repo — see
      # tests/fuzz/corpus/*/regressions.seeds and docs/process/bug-ledger.md.
      #
      # The comment below about "the regression lane above catches it forever"
      # has been describing this step since before it existed.
      - name: Test (fuzz regression corpus)
        run: ctest --test-dir build -L fuzz-regress --output-on-failure --timeout 600

      # Documentation/maturity contract (docs/process/engineering-standards.md): doc
      # front-matter must match the tree, tier claims must have evidence, and
      # ENGINE_STATUS.md must be regenerated. Platform-independent, so it runs
      # only on the gating leg — the other legs would just repeat it.
      - name: Test (docs contract)
        if: matrix.name == 'macOS (arm64, AppleClang)'
        shell: bash
        run: ctest --test-dir build -L docs --output-on-failure

      # The exploration lane is NOT run here: it uses fresh seeds, so it could
      # fail on a commit that did not cause the bug, which would make CI a coin
      # flip. It belongs on a schedule (nightly / self-hosted soak), where a
      # find gets triaged and its seed committed to the corpus — after which
      # the regression lane above catches it forever.

      # The build tree is large and mostly uninteresting; the logs are what
      # you need to triage a failing platform, and `compile_commands.json`
      # lets you reproduce a single failing translation unit locally.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: |
            build-output.log
            build/CMakeCache.txt
            build/compile_commands.json
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  # The shipping posture is a build-level invariant ("the runtime never parses
  # FBX" — Assimp is neither compiled nor linked). It's cheap to verify and
  # easy to break by adding an include, so it gets its own lane.
  shipping-runtime:
    name: Shipping runtime (no source importers)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply third-party patches
        if: hashFiles('third_party/patches/*.patch') != ''
        shell: bash
        run: ./scripts/apply_third_party_patches.sh

      - run: brew install ninja

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shipping-macos
          max-size: 1G

      - name: Configure (importers OFF)
        run: |
          cmake -B build-ship -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_WITH_SOURCE_IMPORTERS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build engine_player
        run: cmake --build build-ship --target engine_player --parallel

      # Assimp links statically, so its symbols would be DEFINED in the binary
      # rather than undefined — check the whole symbol table, not just `nm -u`.
      - name: Assert Assimp is not linked in
        shell: bash
        run: |
          bin=build-ship/engine_player
          test -f "$bin" || { echo "::error::$bin was not produced"; exit 1; }
          if nm "$bin" 2>/dev/null | grep -qi assimp; then
            echo "::error::engine_player contains Assimp symbols — the cooked-runtime invariant (runtime never parses source formats) is broken."
            nm "$bin" | grep -i assimp | head -20
            exit 1
          fi
          echo "OK: no Assimp symbols in engine_player"

  # ── Sanitizers ──────────────────────────────────────────────────────────────
  # ENGINE_SANITIZE had been wired into CMake for a long time and NOTHING EVER
  # RAN IT. The first time this lane was executed it found two real defects in
  # code that had been passing its tests for weeks:
  #
  #   * a heap-buffer-overflow in UndoStack::push — `begin() + m_index + 1`
  #     parses as `(begin() + m_index) + 1`, so with m_index == -1 the
  #     intermediate deque iterator read 8 bytes before the block map
  #   * a stack-buffer-overflow in cooker_test's base64 helper (80 % 3 == 2, and
  #     the loop read buf[i+2] on the short final group)
  #   * a LIVELOCK in engine::jobs — external threads never registered with
  #     enkiTS, so every one of them shared thread-slot 0 with the main thread.
  #     TSan's timing exposed it ~1 run in 5; without a sanitizer it is rare
  #     enough to ship. jobs::parallelFor is documented as callable from kit
  #     threads, and the audio provider ABI tells providers to use it from
  #     theirs, so this was live on a path we had just published.
  #
  # None of the three is reachable through ordinary test failure: two produced
  # correct results while reading out of bounds, and the third only appeared
  # under timing the normal lane never produces. That is the entire argument for
  # this lane, and the reason it gates rather than merely reports.
  #
  # Separate build dirs per lane because the two are mutually exclusive: TSan
  # cannot be combined with ASan. Debug, because sanitizer stacks in an
  # optimized build are much harder to read.
  sanitizers:
    name: Sanitizers (${{ matrix.san }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address,undefined
            slug: asan
            # ASan+UBSan gates: both findings above came from here.
            experimental: false
          - san: thread
            slug: tsan
            # I expected a noisy first pass — enkiTS, flecs and bgfx all carry
            # their own synchronisation — and was wrong: the whole unit lane is
            # CLEAN under TSan, zero warnings, including jobs_test. So it gates
            # from the start rather than reporting. If it ever goes red, that is
            # a real race and not a backlog of untriaged noise.
            experimental: false
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply third-party patches
        if: hashFiles('third_party/patches/*.patch') != ''
        shell: bash
        run: ./scripts/apply_third_party_patches.sh

      - run: brew install ninja

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: san-${{ matrix.slug }}-macos
          max-size: 2G

      # Editor OFF: it needs ImGui + a window, contributes no coverage the unit
      # lane does not already have, and doubles the instrumented build.
      - name: Configure
        run: |
          cmake -B build-${{ matrix.slug }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENGINE_SANITIZE=${{ matrix.san }} \
            -DENGINE_BUILD_EDITOR=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-${{ matrix.slug }} --parallel

      # halt_on_error keeps the first report as the failure rather than letting
      # a later, unrelated one become the visible one.
      - name: Test (unit lane)
        working-directory: build-${{ matrix.slug }}
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: ctest -L unit --output-on-failure --timeout 600

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.slug }}-logs
          path: build-${{ matrix.slug }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
